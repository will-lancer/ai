[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-reward-hacking"
version = "0.1.0"
description = "Reproducible tests of audit-conditioned behavioral modes under one fixed objective"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]
colab = [
  "numpy==1.26.4",
  "scipy==1.14.1",
  "pandas==2.2.3",
  "matplotlib==3.9.2",
  "scikit-learn==1.5.2",
  "diptest==0.10.0",
  "torch==2.5.1",
]
lm = [
  "transformers==4.48.3",
  "trl==0.15.2",
  "accelerate==1.3.0",
  "peft==0.14.0",
  "bitsandbytes==0.45.2",
  "datasets==3.2.0",
  "safetensors==0.5.2",
  "sentencepiece==0.2.0",
  "jsonlines==4.0.0",
  "filelock==3.16.1",
]

[project.scripts]
lean-reward-hacking = "lean_reward_hacking.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
